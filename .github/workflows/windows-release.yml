name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PY_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read and validate build version
        shell: pwsh
        run: |
          $spec = Get-Content -Raw packaging/ZFTP.iss
          if ($spec -notmatch '(?m)^#define AppVersion "([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Could not read the installer version"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Installer version $version does not match $env:GITHUB_REF_NAME"
          }
          "ZFTP_BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies and run preflight
        run: |
          python -m pip install -r requirements.txt Pillow
          python verify_release.py
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              !(Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe") -and
              !(Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      - name: Build the app and installer
        shell: cmd
        run: call build_all.bat --no-pause
      - name: Smoke-test installer and updater
        shell: powershell
        run: |
          $installer = "installer_output/ZFTP_Setup_v$env:ZFTP_BUILD_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'Z FTP smoke test'
          $setup = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`""
          ) -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "Installer exited with code $($setup.ExitCode)"
          }
          if (!(Test-Path -LiteralPath (Join-Path $installDir 'ZFTP.exe'))) {
            throw 'The app executable was not installed'
          }
          $version = $env:ZFTP_BUILD_VERSION
          if (!(Select-String -LiteralPath (Join-Path $installDir 'zftp-version.ini') -Pattern "^Version=$([regex]::Escape($version))$")) {
            throw 'The installed version is incorrect'
          }
          $sender = Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\AppUserModelId\Zyvelia.ZFTP'
          if ($sender.DisplayName -cne 'Z FTP' -or !(Test-Path -LiteralPath $sender.IconUri)) {
            throw 'Z FTP notification sender was not registered with its name and icon'
          }
          & (Join-Path $installDir 'Update-ZFTP.ps1') -CheckOnly
          if (!$?) { throw 'The updater check failed' }
      - name: Smoke-test portable installation
        shell: powershell
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'Z FTP portable smoke test'
          $installer = "installer_output/ZFTP_Setup_v$env:ZFTP_BUILD_VERSION.exe"
          $setup = Start-Process -FilePath $installer -ArgumentList @(
            '/PORTABLE=1', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$portable`""
          ) -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path (Join-Path $portable 'ZFTP.exe')) -or
              !(Test-Path (Join-Path $portable 'zftp-portable.ini')) -or (Get-ChildItem $portable -Filter 'unins*.exe')) {
            throw 'Portable setup did not produce a standalone folder'
          }
          if (!(Select-String -LiteralPath (Join-Path $portable 'zftp-portable.ini') -Pattern '^Portable=1$')) {
            throw 'Portable setup marker is invalid'
          }
      - name: Upload installer for manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ZFTP-Windows-installer
          path: installer_output/ZFTP_Setup_v${{ env.ZFTP_BUILD_VERSION }}.exe
          if-no-files-found: error
      - name: Publish Windows installer
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "installer_output/ZFTP_Setup_v$env:ZFTP_BUILD_VERSION.exe"
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Missing installer $installer"
          }
          gh release create $env:GITHUB_REF_NAME $installer --verify-tag --generate-notes --title "Z FTP $env:GITHUB_REF_NAME"
